      html.bleed, html.bleed body { height: auto; overflow: visible; }
      .name { position: fixed; left: 0; bottom: -1px; display: block; width: 100vw; height: var(--name-h); fill: #fff; mix-blend-mode: difference; pointer-events: none; z-index: 2; }
